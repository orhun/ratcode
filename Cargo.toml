[package]
name = "ratcode"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = "0.28"
dotenvy = "0.15"
futures = "0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
rig = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
